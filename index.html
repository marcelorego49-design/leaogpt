<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador e Baixador de APK</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid var(--border);
        }
        h2 { font-size: 20px; margin-top: 0; color: #38bdf8; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--text-muted); }
        input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background-color: var(--primary-hover); }
        .section { margin-bottom: 30px; }
        .result {
            margin-top: 15px;
            display: none;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .btn-download {
            display: inline-block;
            margin-top: 10px;
            background: #10b981;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ÁREA DE BUSCAR APK -->
    <div class="section">
        <h2>Baixar Aplicativo</h2>
        <div class="input-group">
            <label>Digite o Código</label>
            <input type="text" id="codigo-busca" placeholder="Ex: v1">
        </div>
        <button onclick="buscarApp()">Buscar e Baixar</button>
        
        <div id="result" class="result">
            <p id="file-name" style="margin: 0 0 10px 0; font-size: 14px; color: #34d399;"></p>
            <a id="download-link" href="#" class="btn-download" target="_blank">Baixar APK Direto</a>
        </div>
    </div>

    <!-- ÁREA DE CADASTRAR NOVO LINK -->
    <div class="section" style="margin-bottom: 0;">
        <h2>Cadastrar Novo Link</h2>
        <div class="input-group">
            <label>Código do App</label>
            <input type="text" id="novo-codigo" placeholder="Ex: v1">
        </div>
        <div class="input-group">
            <label>Nome do Arquivo</label>
            <input type="text" id="novo-nome" placeholder="Ex: app.apk">
        </div>
        <div class="input-group">
            <label>Link Direto</label>
            <input type="text" id="novo-link" placeholder="Cole o link direto do APK aqui">
        </div>
        <button onclick="cadastrarApp()" style="background-color: #059669;">Salvar no Banco</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://cytwyaqgwoqvwgzpzlkl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_QagXEewFZaSqdPZPx9IMMA_45nYDINd';
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function buscarApp() {
        const codigo = document.getElementById('codigo-busca').value.trim();
        const resultBox = document.getElementById('result');
        const fileNameEl = document.getElementById('file-name');
        const downloadLinkEl = document.getElementById('download-link');

        if (!codigo) { alert("Digite um código para buscar."); return; }

        const { data, error } = await _supabase
            .from('apks')
            .select('*')
            .eq('codigo', codigo)
            .single();

        if (error || !data) {
            alert("Código não encontrado.");
            resultBox.style.display = 'none';
        } else {
            fileNameEl.textContent = `Arquivo: ${data.nome_arquivo}`;
            downloadLinkEl.href = data.link_download;
            resultBox.style.display = 'block';
        }
    }

    async function cadastrarApp() {
        const codigo = document.getElementById('novo-codigo').value.trim();
        const nome = document.getElementById('novo-nome').value.trim();
        const link = document.getElementById('novo-link').value.trim();

        if (!codigo || !nome || !link) {
            alert("Preencha todos os campos!");
            return;
        }

        const { error } = await _supabase
            .from('apks')
            .insert([{ codigo: codigo, nome_arquivo: nome, link_download: link }]);

        if (error) {
            alert("Erro ao salvar: " + error.message);
        } else {
            alert("Cadastrado com sucesso! O código já está ativo.");
            document.getElementById('novo-codigo').value = '';
            document.getElementById('novo-nome').value = '';
            document.getElementById('novo-link').value = '';
        }
    }
</script>

</body>
</html>
